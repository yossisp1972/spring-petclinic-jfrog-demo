name: JFrog Integrated CI

on:
  workflow_dispatch:

concurrency:
  group: jfrog-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  RESOLVE_REPO: maven-virtual
  DEPLOY_REPO: maven-local
  BUILD_NAME: spring-petclinic-jfrog
  BUILD_NUMBER: ${{ github.run_number }}
  JFROG_CLI_BUILD_NAME: spring-petclinic-jfrog
  JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  jfrog-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.JF_URL }}"
          test -n "${{ secrets.JF_ACCESS_TOKEN }}"

      - name: Verify JFrog connectivity and repository access
        run: |
          jf rt ping
          jf rt curl -sf "/api/repositories/${RESOLVE_REPO}" > /dev/null || {
            echo "Unable to access resolve repository ${RESOLVE_REPO}. Check JF_URL, token permissions, and repository visibility."
            exit 1
          }
          jf rt curl -sf "/api/repositories/${DEPLOY_REPO}" > /dev/null || {
            echo "Unable to access deploy repository ${DEPLOY_REPO}. Check token deploy permissions and repository visibility."
            exit 1
          }

      - name: Configure Maven to resolve and deploy via JFrog
        run: |
          jf mvn-config \
            --repo-resolve-releases "${RESOLVE_REPO}" \
            --repo-resolve-snapshots "${RESOLVE_REPO}" \
            --repo-deploy-releases "${DEPLOY_REPO}" \
            --repo-deploy-snapshots "${DEPLOY_REPO}"

      #build using jfrog cli in batch mode and skip tests, deletes previous
      - name: Build and collect build info
        run: |
          jf mvn -B -DskipTests clean package

      - name: Xray dependency audit
        run: |
          set +e # continue on audit errors to allow handling of optional entitlement limits
          jf audit --format=json > jfrog-audit.json 2> jfrog-audit.err
          AUDIT_EXIT=$?
          set -e

          if [ ${AUDIT_EXIT} -ne 0 ]; then
            echo "jf audit failed with exit ${AUDIT_EXIT}." >&2
            cat jfrog-audit.err >&2
            exit ${AUDIT_EXIT}
          fi

      - name: Xray artifact scan
        run: |
          set +e # continue on scan errors to allow handling of optional entitlement limits
          jf scan "target/*.jar" --format=json > jfrog-scan.json 2> jfrog-scan.err
          SCAN_EXIT=$?
          set -e

          if [ ${SCAN_EXIT} -ne 0 ]; then
            echo "jf scan failed with exit ${SCAN_EXIT}." >&2
            cat jfrog-scan.err >&2
            exit ${SCAN_EXIT}
          fi

      - name: Upload jar to JFrog Artifactory
        run: |
          jf rt upload "target/*.jar" "${DEPLOY_REPO}/org/springframework/samples/petclinic/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/"

      - name: Publish build info to JFrog
        run: |
          jf rt build-collect-env "${BUILD_NAME}" "${BUILD_NUMBER}"
          jf rt build-add-git "${BUILD_NAME}" "${BUILD_NUMBER}"
          jf rt build-publish "${BUILD_NAME}" "${BUILD_NUMBER}"

      - name: Scan published build in Xray
        run: |
          echo "failed" > jfrog-build-scan.status
          set +e
          jf build-scan "${BUILD_NAME}" "${BUILD_NUMBER}" > jfrog-build-scan.out 2> jfrog-build-scan.err
          BUILD_SCAN_EXIT=$?
          set -e

          if [ ${BUILD_SCAN_EXIT} -eq 0 ]; then
            echo "success" > jfrog-build-scan.status
          else
            if grep -q "not selected for indexing" jfrog-build-scan.err; then
              echo "soft-fail-indexing" > jfrog-build-scan.status
              echo "jf build-scan returned exit ${BUILD_SCAN_EXIT}: build is not selected for Xray indexing."
              echo "To fix: in JFrog UI go to Xray Settings -> Builds Indexing and add 'spring-petclinic-jfrog' to the indexed builds list."
            else
              echo "jf build-scan failed with exit ${BUILD_SCAN_EXIT}." >&2
              cat jfrog-build-scan.err >&2
              exit ${BUILD_SCAN_EXIT}
            fi
          fi

      - name: Publish Xray scan results to workflow summary
        if: always()
        run: |
          JF_BASE=$(echo "${{ secrets.JF_URL }}" | sed 's#/$##')
          BUILD_LIST_URL="${JF_BASE}/ui/builds"
          BUILD_URL="${JF_BASE}/ui/builds/${BUILD_NAME}/${BUILD_NUMBER}/published"
          ARTIFACTS_URL="${JF_BASE}/ui/repos/tree/General/${DEPLOY_REPO}/org/springframework/samples/petclinic/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "## JFrog Xray Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build:** \`${BUILD_NAME}\` #${BUILD_NUMBER}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Build details:** [Open build in JFrog](${BUILD_URL})" >> $GITHUB_STEP_SUMMARY
          echo "**Builds list:** [Open builds view](${BUILD_LIST_URL})" >> $GITHUB_STEP_SUMMARY
          echo "**Uploaded artifacts:** [Open artifact folder](${ARTIFACTS_URL})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          BUILD_SCAN_STATUS="not-run"
          if [ -f jfrog-build-scan.status ]; then
            BUILD_SCAN_STATUS=$(cat jfrog-build-scan.status)
          fi

          if [ "${BUILD_SCAN_STATUS}" = "success" ]; then
            echo "### Build Scan (UI-Aligned)" >> $GITHUB_STEP_SUMMARY
            echo "Build scan completed successfully for this run." >> $GITHUB_STEP_SUMMARY
            echo "See JFrog UI for policy-based issue counts for build \`${BUILD_NAME}\` #${BUILD_NUMBER}." >> $GITHUB_STEP_SUMMARY
          elif [ "${BUILD_SCAN_STATUS}" = "soft-fail-permission" ]; then
            echo "### Build Scan (UI-Aligned)" >> $GITHUB_STEP_SUMMARY
            echo "Build scan could not be fully evaluated due to Xray permission limits for this CI token (403 Forbidden)." >> $GITHUB_STEP_SUMMARY
          elif [ "${BUILD_SCAN_STATUS}" = "soft-fail-indexing" ]; then
            echo "### Build Scan (UI-Aligned)" >> $GITHUB_STEP_SUMMARY
            echo "Build scan could not be fully evaluated because this build is not selected for Xray indexing." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Build Scan (UI-Aligned)" >> $GITHUB_STEP_SUMMARY
            echo "_No build scan report generated._" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Additional Scan Context" >> $GITHUB_STEP_SUMMARY
          echo "_The sections below may differ from JFrog UI totals because they represent source/artifact scope rather than published build scope._" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f jfrog-audit.json ]; then
            echo "### Dependency Audit" >> $GITHUB_STEP_SUMMARY
            CRITICAL=$(jq '[.. | objects | select(.severity=="Critical")] | length' jfrog-audit.json 2>/dev/null || echo "N/A")
            HIGH=$(jq '[.. | objects | select(.severity=="High")] | length' jfrog-audit.json 2>/dev/null || echo "N/A")
            MEDIUM=$(jq '[.. | objects | select(.severity=="Medium")] | length' jfrog-audit.json 2>/dev/null || echo "N/A")
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Critical | ${CRITICAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| High     | ${HIGH} |" >> $GITHUB_STEP_SUMMARY
            echo "| Medium   | ${MEDIUM} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Dependency Audit" >> $GITHUB_STEP_SUMMARY
            echo "_No audit report generated._" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f jfrog-scan.json ]; then
            echo "### Artifact Scan" >> $GITHUB_STEP_SUMMARY
            CRITICAL=$(jq '[.. | objects | select(.severity=="Critical")] | length' jfrog-scan.json 2>/dev/null || echo "N/A")
            HIGH=$(jq '[.. | objects | select(.severity=="High")] | length' jfrog-scan.json 2>/dev/null || echo "N/A")
            MEDIUM=$(jq '[.. | objects | select(.severity=="Medium")] | length' jfrog-scan.json 2>/dev/null || echo "N/A")
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Critical | ${CRITICAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| High     | ${HIGH} |" >> $GITHUB_STEP_SUMMARY
            echo "| Medium   | ${MEDIUM} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Artifact Scan" >> $GITHUB_STEP_SUMMARY
            echo "_No artifact scan report generated._" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Full scan details are also available in [JFrog Builds](${BUILD_LIST_URL})." >> $GITHUB_STEP_SUMMARY

      - name: Upload scan reports as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jfrog-security-reports
          if-no-files-found: warn
          path: |
            jfrog-audit.json
            jfrog-audit.err
            jfrog-scan.json
            jfrog-scan.err
            jfrog-build-scan.out
            jfrog-build-scan.err
            jfrog-build-scan.status
